<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Accent Green Glow -->
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows / Glows -->
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Styles & Animations */
    .bg {
      fill: url(#bg-grad);
    }
    
    .font-title {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    
    .font-subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #9ca3af;
      letter-spacing: 3px;
    }

    .font-mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      fill: #10b981;
    }

    /* Coffee Steam Animation */
    .steam-line {
      stroke: #10b981;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      stroke-dasharray: 20 80;
      animation: steam-rise 4s infinite linear;
    }
    .steam-1 { animation-delay: 0s; }
    .steam-2 { animation-delay: 1.5s; }
    .steam-3 { animation-delay: 2.8s; }

    @keyframes steam-rise {
      0% {
        stroke-dashoffset: 100;
        opacity: 0;
        transform: translateY(0) scaleX(1);
      }
      15% {
        opacity: 0.6;
      }
      50% {
        transform: translateY(-20px) scaleX(1.2);
        opacity: 0.4;
      }
      85% {
        opacity: 0.1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
        transform: translateY(-45px) scaleX(0.8);
      }
    }

    /* Logo Shimmer/Pulse */
    .logo-pulse {
      animation: logo-glow 3s infinite ease-in-out;
    }
    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.7)); }
    }

    /* Grid Lines Background */
    .grid-line {
      stroke: #1f2937;
      stroke-width: 0.8;
      opacity: 0.4;
    }

    /* Dashboard UI Elements */
    .panel-border {
      stroke: #374151;
      stroke-width: 1.5;
      fill: #111827;
      fill-opacity: 0.6;
      rx: 8;
    }

    /* Seat Pulsing Animations */
    .seat-dot {
      r: 6;
      stroke-width: 1.5;
    }
    .seat-available {
      fill: #4b5563;
      stroke: #374151;
    }
    .seat-reserved {
      fill: #3b82f6;
      stroke: #2563eb;
      filter: url(#glow-blue);
      animation: pulse-blue 2s infinite ease-in-out;
    }
    .seat-maintenance {
      fill: #ef4444;
      stroke: #dc2626;
      filter: url(#glow-red);
      animation: pulse-red 2.5s infinite ease-in-out;
    }

    @keyframes pulse-blue {
      0%, 100% { opacity: 0.6; r: 5.5; }
      50% { opacity: 1; r: 7; }
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 0.5; r: 5.5; }
      50% { opacity: 0.9; r: 7; }
    }

    /* Database Status Blink */
    .status-dot {
      fill: #10b981;
      animation: status-blink 1.8s infinite ease-in-out;
    }
    @keyframes status-blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 3px #10b981); }
    }

    /* Text Typing Animation Cursor */
    .cursor {
      fill: #10b981;
      animation: cursor-blink 1s infinite step-end;
    }
    @keyframes cursor-blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Circuit/Data Flow Animation */
    .data-flow {
      stroke: #10b981;
      stroke-width: 1.5;
      stroke-dasharray: 6 30;
      fill: none;
      animation: flow 5s infinite linear;
    }
    @keyframes flow {
      to {
        stroke-dashoffset: -100;
      }
    }
  </style>

  <!-- Background Canvas -->
  <rect class="bg" width="100%" height="100%" rx="12" />

  <!-- Subtle Grid Lines -->
  <g>
    <!-- Horizontal -->
    <line x1="0" y1="40" x2="800" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="800" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="800" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="800" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="800" y2="200" class="grid-line" />
    <line x1="0" y1="240" x2="800" y2="240" class="grid-line" />
    <line x1="0" y1="280" x2="800" y2="280" class="grid-line" />
    <!-- Vertical -->
    <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="320" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
  </g>

  <!-- Left Sidebar UI Representation -->
  <rect x="25" y="65" width="220" height="210" class="panel-border" />
  
  <!-- Right Dashboard Grid UI Representation -->
  <rect x="525" y="65" width="250" height="210" class="panel-border" />

  <!-- Data Flow connection line between left & right -->
  <path d="M 245 120 L 525 120" stroke="#374151" stroke-width="1.5" fill="none" />
  <path d="M 245 120 L 525 120" class="data-flow" />
  
  <path d="M 245 220 L 525 220" stroke="#374151" stroke-width="1.5" fill="none" />
  <path d="M 245 220 L 525 220" class="data-flow" style="animation-delay: 2.5s;" />

  <!-- Status Bar Top Right -->
  <g transform="translate(620, 25)">
    <circle cx="10" cy="15" r="5" class="status-dot" />
    <text x="22" y="19" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#10b981" font-weight="600">LIVE SYNC ACTIVE</text>
  </g>

  <!-- Title Section (Center) -->
  <g transform="translate(280, 135)">
    <text class="font-title logo-pulse">The Study Cafe</text>
    <text x="2" y="32" class="font-subtitle">PORTAL &amp; CONTROL CENTER</text>
  </g>

  <!-- Animated Coffee Logo Icon (Left Card) -->
  <g transform="translate(90, 110)">
    <!-- Coffee Cup Outer Ring Glow -->
    <circle cx="45" cy="45" r="38" fill="#111827" stroke="#1f2937" stroke-width="2" />
    
    <!-- Steam Trails -->
    <path d="M 33 5 Q 36 -5 32 -15" class="steam-line steam-1" />
    <path d="M 45 5 Q 48 -8 44 -18" class="steam-line steam-2" />
    <path d="M 57 5 Q 60 -5 56 -15" class="steam-line steam-3" />

    <!-- Coffee Cup Body -->
    <path d="M 25 24 L 65 24 C 65 52 25 52 25 24 Z" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Handle -->
    <path d="M 65 30 C 72 30 72 40 65 40" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Saucer -->
    <line x1="20" y1="52" x2="70" y2="52" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <text x="50" y="235" class="font-mono" font-size="11">&gt; firebase_auth_ok</text>
  <text x="50" y="253" class="font-mono" font-size="11" fill="#9ca3af">&gt; admin_user</text>

  <!-- Interactive Grid Visual (Right Card) -->
  <g transform="translate(555, 95)">
    <!-- 4x5 Seating Arrangement Grid -->
    <!-- Row 1 -->
    <circle cx="20" cy="20" class="seat-dot seat-available" />
    <circle cx="60" cy="20" class="seat-dot seat-reserved" />
    <circle cx="100" cy="20" class="seat-dot seat-available" />
    <circle cx="140" cy="20" class="seat-dot seat-available" />
    <circle cx="180" cy="20" class="seat-dot seat-maintenance" />

    <!-- Row 2 -->
    <circle cx="20" cy="60" class="seat-dot seat-reserved" />
    <circle cx="60" cy="60" class="seat-dot seat-available" />
    <circle cx="100" cy="60" class="seat-dot seat-reserved" />
    <circle cx="140" cy="60" class="seat-dot seat-available" />
    <circle cx="180" cy="60" class="seat-dot seat-reserved" />

    <!-- Row 3 -->
    <circle cx="20" cy="100" class="seat-dot seat-available" />
    <circle cx="60" cy="100" class="seat-dot seat-available" />
    <circle cx="100" cy="100" class="seat-dot seat-available" />
    <circle cx="140" cy="100" class="seat-dot seat-maintenance" />
    <circle cx="180" cy="100" class="seat-dot seat-available" />

    <!-- Row 4 -->
    <circle cx="20" cy="140" class="seat-dot seat-reserved" />
    <circle cx="60" cy="140" class="seat-dot seat-reserved" />
    <circle cx="100" cy="140" class="seat-dot seat-available" />
    <circle cx="140" cy="140" class="seat-dot seat-reserved" />
    <circle cx="180" cy="140" class="seat-dot seat-available" />
    
    <!-- Legend indicators at bottom of grid card -->
    <circle cx="20" cy="190" r="4.5" fill="#3b82f6" />
    <text x="32" y="193" font-family="Inter" font-size="9" fill="#9ca3af">Reserved</text>
    
    <circle cx="95" cy="190" r="4.5" fill="#4b5563" />
    <text x="107" y="193" font-family="Inter" font-size="9" fill="#9ca3af">Vacant</text>
    
    <circle cx="160" cy="190" r="4.5" fill="#ef4444" />
    <text x="172" y="193" font-family="Inter" font-size="9" fill="#9ca3af">Repair</text>
  </g>
</svg>
